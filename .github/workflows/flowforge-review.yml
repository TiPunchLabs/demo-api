# Hands pull requests to the FlowForge Reviewer agent (read-only review, one PR comment).
#
# No agent logic lives here: everything is in the FlowForge reusable workflow.
# `@main` is a POC reference (FlowForge has no tag yet); pin to a tag or commit SHA
# once FlowForge publishes releases.
#
# Triggers:
# - workflow_dispatch: Draft PRs opened by the Developer with GITHUB_TOKEN do not fire
#   `pull_request` workflows, so agent PRs are reviewed on demand:
#     gh workflow run flowforge-review.yml -f pull_request_number=<n>
# - pull_request: human activity (push, reopen, ready for review) on an `agent/*` branch
#   of this repository targeting main. Forks and other branches are ignored, and so are
#   runs whose actor is github-actions[bot] (claude-code-action refuses bot actors).
name: FlowForge review

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request to review
        type: number
        required: true
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main

permissions: {}

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && startsWith(github.event.pull_request.head.ref, 'agent/')
          && github.actor != 'github-actions[bot]')
    uses: TiPunchLabs/flowforge/.github/workflows/agent-review.yml@main
    # Must cover what the called workflow requests; it can only narrow, never widen.
    # Code stays read-only; the only write is the FlowForge comment on the PR.
    permissions:
      contents: read
      issues: read
      pull-requests: write
      checks: read
      statuses: read
    with:
      pull_request_number: ${{ fromJSON(inputs.pull_request_number || github.event.pull_request.number) }}
      setup_uv: true
      # NON-DESTRUCTIVE checks only, as exact rules: a prefix rule such as
      # "Bash(uv run ruff check:*)" would also allow --fix.
      allowed_tools: "Bash(uv sync --locked),Bash(uv run pytest:*),Bash(uv run ruff check .),Bash(uv run ruff format --check .)"
    # Organization secret (Selected repositories). Explicit contract: never `secrets: inherit`.
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
