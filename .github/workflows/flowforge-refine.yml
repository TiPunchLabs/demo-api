# TEMPORARY TEST CALLER — branch test/phase9-semi-auto-e2e only, never merged (FlowForge Phase 9,
# Prompt 44.2). Delete the branch after the live validation; `main` keeps the v0.1.0 caller.
#
# Hands one Issue to the FlowForge Refiner agent, on demand, from this branch:
#   gh workflow run flowforge-refine.yml --ref test/phase9-semi-auto-e2e \
#     -f issue_number=<n> -f autonomy_mode=SUPERVISED|SEMI_AUTO -f allow_develop=false|true
#
# Differences from the FlowForge template (examples/target-repository/flowforge-refine.yml):
# - pinned to FlowForge 9338f25 (main after PR #69: SEMI_AUTO + gate fixes), not a release;
# - the autonomy mode is a dispatch input (default SUPERVISED) instead of the repository variable,
#   so no repository variable is set and `main` stays SUPERVISED; the owner is fixed here, never an
#   input: a dispatcher cannot name themselves;
# - `allow_develop` (default false) is a test-only kill switch: blocking scenarios run with it
#   off, so even a wrong AUTO_START cannot start the Developer (the Issue would only get
#   agent:ready, which triggers nothing when set with GITHUB_TOKEN).
name: FlowForge refine

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue to refine
        type: number
        required: true
      autonomy_mode:
        description: Autonomy mode for this test run
        type: choice
        options: [SUPERVISED, SEMI_AUTO]
        default: SUPERVISED
      allow_develop:
        description: Let the develop job run on a verified AUTO_START (test kill switch)
        type: boolean
        default: false

permissions: {}

jobs:
  refine:
    uses: TiPunchLabs/flowforge/.github/workflows/agent-refine.yml@9338f258b5c28831a109a46d61f2091e82e14381 # main after #69 (Phase 9 test pin)
    # Must cover what the called workflow requests; it can only narrow, never widen.
    # Code stays read-only; the only writes are the Issue, its state label and one comment.
    permissions:
      contents: read
      issues: write
      pull-requests: read
    with:
      # fromJSON: workflow_dispatch inputs reach `inputs` as strings; the input is a number.
      issue_number: ${{ fromJSON(inputs.issue_number) }}
      # GitHub Project sync (FlowForge Prompt 28): organization variable, unset = 0 = off.
      project_number: ${{ fromJSON(vars.FLOWFORGE_PROJECT_NUMBER || '0') }}
      # FlowForge GitHub App, Project token only: the Refiner agent never receives it.
      app_client_id: ${{ vars.FLOWFORGE_APP_CLIENT_ID }}
      autonomy_mode: ${{ inputs.autonomy_mode }}
      # The repository's human owner (FlowForge autonomy contract, Q3).
      autonomy_owner: xgueret
    # Organization secret (Selected repositories). Explicit contract: never `secrets: inherit`.
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      app_private_key: ${{ secrets.FLOWFORGE_APP_PRIVATE_KEY }}

  # SEMI_AUTO only: same job as flowforge-agent.yml on main (same reusable workflow code —
  # agent-develop.yml is unchanged between v0.1.0 and 9338f25 —, permissions, inputs, secrets).
  develop:
    needs: refine
    if: needs.refine.outputs.autostart == 'true' && inputs.allow_develop
    uses: TiPunchLabs/flowforge/.github/workflows/agent-develop.yml@9338f258b5c28831a109a46d61f2091e82e14381 # main after #69 (Phase 9 test pin)
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      issue_number: ${{ fromJSON(inputs.issue_number) }}
      base_branch: ${{ needs.refine.outputs.base_branch }}
      setup_uv: true
      allowed_tools: "Bash(uv sync:*),Bash(uv run pytest:*),Bash(uv run ruff:*),Bash(uv run pre-commit:*)"
      app_client_id: ${{ vars.FLOWFORGE_APP_CLIENT_ID }}
      project_number: ${{ fromJSON(vars.FLOWFORGE_PROJECT_NUMBER || '0') }}
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      app_private_key: ${{ secrets.FLOWFORGE_APP_PRIVATE_KEY }}
