# Hands one Issue to the FlowForge Refiner agent, on demand:
#   gh workflow run flowforge-refine.yml -f issue_number=<n>
#
# No agent logic lives here: everything is in the FlowForge reusable workflow.
# `@main` is a POC reference (FlowForge has no tag yet); pin to a tag or commit SHA
# once FlowForge publishes releases.
#
# The Refiner rewrites the Issue title and body (original request kept verbatim), sets
# agent:needs-clarification when blocking questions remain, and never applies agent:ready:
# starting the Developer stays a human decision.
name: FlowForge refine

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue to refine
        type: number
        required: true

permissions: {}

jobs:
  refine:
    uses: TiPunchLabs/flowforge/.github/workflows/agent-refine.yml@main
    # Must cover what the called workflow requests; it can only narrow, never widen.
    # Code stays read-only; the only writes are the Issue, its state label and one comment.
    permissions:
      contents: read
      issues: write
      pull-requests: read
    with:
      # fromJSON: workflow_dispatch inputs reach `inputs` as strings; the input is a number.
      issue_number: ${{ fromJSON(inputs.issue_number) }}
    # Organization secret (Selected repositories). Explicit contract: never `secrets: inherit`.
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
